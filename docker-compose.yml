# nightly in Docker: the panel plus ClickHouse. Copy .env.example to .env, set the admin and passwords, then
#   docker compose up -d
# The panel creates and syncs its tables (SQLite and ClickHouse) on every start. ClickHouse alone, for a panel
# run outside Docker:  docker compose up -d clickhouse
services:
  panel:
    build: .
    container_name: nightly-panel
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      NIGHTLY_ADMIN_USER: ${NIGHTLY_ADMIN_USER:-admin}
      NIGHTLY_ADMIN_PASSWORD: ${NIGHTLY_ADMIN_PASSWORD:-}
      NIGHTLY_PUBLIC_URL: ${NIGHTLY_PUBLIC_URL:-}
      NIGHTLY_CLICKHOUSE_URL: http://clickhouse:8123
      NIGHTLY_CLICKHOUSE_DB: ${NIGHTLY_CLICKHOUSE_DB:-nightly_usage}
      NIGHTLY_CLICKHOUSE_USER: ${NIGHTLY_CLICKHOUSE_USER:-nightly}
      NIGHTLY_CLICKHOUSE_PASSWORD: ${NIGHTLY_CLICKHOUSE_PASSWORD:-nightly-dev-password}
    ports:
      - "${NIGHTLY_BIND:-0.0.0.0}:${NIGHTLY_PORT:-3010}:3010"
    volumes:
      - panel-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    container_name: nightly-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${NIGHTLY_CLICKHOUSE_DB:-nightly_usage}
      CLICKHOUSE_USER: ${NIGHTLY_CLICKHOUSE_USER:-nightly}
      CLICKHOUSE_PASSWORD: ${NIGHTLY_CLICKHOUSE_PASSWORD:-nightly-dev-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      # Localhost only by default. Set NIGHTLY_CLICKHOUSE_BIND=0.0.0.0 only on a trusted network, with a real password.
      - "${NIGHTLY_CLICKHOUSE_BIND:-127.0.0.1}:${NIGHTLY_CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Runs once, on the first start of an empty volume. `nightly usage ensure` applies the same file to an existing one.
      - ./deploy/clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./deploy/clickhouse/schema.sql:/usr/share/nightly/schema.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  panel-data:
  clickhouse-data:
