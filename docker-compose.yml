# Optional services for nightly. The panel and the CLI work without any of this:
# ClickHouse only adds long-range history for the Usage tab (see README, "Usage").
#   docker compose up -d clickhouse
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    container_name: nightly-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${NIGHTLY_CLICKHOUSE_DB:-nightly_usage}
      CLICKHOUSE_USER: ${NIGHTLY_CLICKHOUSE_USER:-nightly}
      CLICKHOUSE_PASSWORD: ${NIGHTLY_CLICKHOUSE_PASSWORD:-nightly-dev-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      # Localhost only by default. Set NIGHTLY_CLICKHOUSE_BIND=0.0.0.0 only on a trusted network, with a real password.
      - "${NIGHTLY_CLICKHOUSE_BIND:-127.0.0.1}:${NIGHTLY_CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Runs once, on the first start of an empty volume. `nightly usage ensure` applies the same file to an existing one.
      - ./deploy/clickhouse/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./deploy/clickhouse/schema.sql:/usr/share/nightly/schema.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  clickhouse-data:
