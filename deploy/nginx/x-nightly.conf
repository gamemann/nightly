# Nightly panel: http://x-nightly -> the panel on 127.0.0.1:3010 (next start, user core; scripts/restart-panel.sh).
# Plain HTTP on purpose (LAN name, no TLS). Add a 443 block with /opt/tmc.crt if a certificate name is ever needed.
server {
    listen 80;
    server_name x-nightly x-nightly.deacon.internal;

    client_max_body_size 512M;      # asset and map uploads
    access_log /var/log/nginx/x-nightly_access.log;
    error_log  /var/log/nginx/x-nightly_error.log;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # websockets / live transcript streams
        proxy_read_timeout 3600s;                          # long-lived streams (SSE)
        proxy_buffering off;
    }
}
